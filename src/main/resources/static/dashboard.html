<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat0z - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            gap: 0.5rem;
        }

        .sidebar-logo {
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0 0.5rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .sidebar-logo span {
            color: var(--primary);
        }

        .sidebar-section {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-muted);
            padding: 0.5rem 0.5rem 0.25rem;
            margin-top: 0.75rem;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            width: 100%;
            padding: 0.6rem 0.75rem;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: left;
            border: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar-btn:hover {
            background: var(--bg-input);
            color: var(--text-main);
        }

        .sidebar-btn svg {
            flex-shrink: 0;
            stroke: currentColor;
        }

        .sidebar-profile {
            margin-top: auto;
            padding: 0.75rem;
            border-radius: var(--radius);
            background: var(--bg-input);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar-profile .info {
            flex: 1;
            min-width: 0;
        }

        .sidebar-profile .name {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-profile .email {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-profile button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            transition: color 0.15s;
        }

        .sidebar-profile button:hover {
            color: var(--danger);
        }

        /* Main content */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 2.5rem 2.5rem;
        }

        .main-header {
            margin-bottom: 2rem;
        }

        .main-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: border-color 0.15s;
        }

        .room-card:hover {
            border-color: var(--primary);
        }

        .room-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .room-card-name {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-card-role {
            font-size: 0.72rem;
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            border-radius: 99px;
            padding: 0.2rem 0.6rem;
            white-space: nowrap;
        }

        .room-card-id {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .room-card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .room-card-actions button {
            flex: 1;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">Chat<span>0z</span></div>

    <div class="sidebar-section">Salas</div>
    <button class="sidebar-btn" onclick="openModal('create-modal')">
        <svg width="16" height="16" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor"/>
            <path d="M12 8v8M8 12h8" stroke="currentColor"/>
        </svg>
        Criar sala
    </button>
    <button class="sidebar-btn" onclick="openModal('join-modal')">
        <svg width="16" height="16" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor"/>
            <polyline points="10 17 15 12 10 7" stroke="currentColor"/>
            <line x1="15" y1="12" x2="3" y2="12" stroke="currentColor"/>
        </svg>
        Entrar com convite
    </button>

    <div class="sidebar-section">Conta</div>
    <button class="sidebar-btn" onclick="openModal('profile-modal')">
        <svg width="16" height="16" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor"/>
        </svg>
        Editar perfil
    </button>

    <div class="sidebar-profile">
        <img id="profile-pic" class="avatar" src="" alt="avatar" onerror="this.style.display='none'">
        <div class="info">
            <div class="name" id="profile-name">Carregando...</div>
            <div class="email" id="profile-email"></div>
        </div>
        <button onclick="logout()" title="Sair">
            <svg width="16" height="16" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor"/>
                <polyline points="16 17 21 12 16 7" stroke="currentColor"/>
                <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor"/>
            </svg>
        </button>
    </div>
</aside>

<main class="main">
    <div class="main-header">
        <h1>Minhas Salas</h1>
        <p>Selecione uma sala para comecar a conversar ou crie uma nova.</p>
    </div>

    <div class="toolbar">
        <button class="btn-primary" onclick="openModal('create-modal')">Nova sala</button>
        <button class="btn-ghost" onclick="openModal('join-modal')">Entrar com convite</button>
    </div>

    <div id="rooms-container">
        <div class="loader">Carregando salas...</div>
    </div>
</main>

<!-- Create room modal -->
<div class="modal-backdrop" id="create-modal">
    <div class="modal">
        <h2>Criar nova sala</h2>
        <div class="field">
            <label for="room-name">Nome da sala</label>
            <input id="room-name" type="text" placeholder="Ex: Sala dos amigos">
        </div>
        <div class="field">
            <label for="room-invite">Codigo de convite</label>
            <input id="room-invite" type="text" placeholder="Ex: amigos2025">
        </div>
        <div class="actions">
            <button class="btn-ghost" onclick="closeModal('create-modal')">Cancelar</button>
            <button class="btn-primary" onclick="createRoom()">Criar</button>
        </div>
    </div>
</div>

<!-- Join room modal -->
<div class="modal-backdrop" id="join-modal">
    <div class="modal">
        <h2>Entrar em uma sala</h2>
        <div class="field">
            <label for="join-invite">Codigo de convite</label>
            <input id="join-invite" type="text" placeholder="Cole o codigo aqui">
        </div>
        <div class="actions">
            <button class="btn-ghost" onclick="closeModal('join-modal')">Cancelar</button>
            <button class="btn-primary" onclick="joinRoom()">Entrar</button>
        </div>
    </div>
</div>

<!-- Edit profile modal -->
<div class="modal-backdrop" id="profile-modal">
    <div class="modal">
        <h2>Editar perfil</h2>
        <div class="field">
            <label for="edit-nickname">Apelido</label>
            <input id="edit-nickname" type="text" placeholder="Seu apelido">
        </div>
        <div class="field">
            <label for="edit-pic">URL da foto de perfil</label>
            <input id="edit-pic" type="text" placeholder="https://...">
        </div>
        <div class="actions">
            <button class="btn-ghost" onclick="closeModal('profile-modal')">Cancelar</button>
            <button class="btn-primary" onclick="updateProfile()">Salvar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let currentUser = null;

    function showToast(message, isError) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'toast' + (isError ? ' error' : '') + ' visible';
        setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function openModal(id) {
        document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    document.querySelectorAll('.modal-backdrop').forEach(el => {
        el.addEventListener('click', function (e) {
            if (e.target === this) this.classList.remove('open');
        });
    });

    async function apiFetch(url, options) {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
            window.location.href = '/';
            return null;
        }
        return res;
    }

    async function loadUser() {
        const res = await apiFetch('/user/me');
        if (!res) return;
        if (!res.ok) { window.location.href = '/'; return; }
        currentUser = await res.json();
        document.getElementById('profile-name').textContent = currentUser.nickname || currentUser.email;
        document.getElementById('profile-email').textContent = currentUser.email;
        if (currentUser.picProfile) {
            document.getElementById('profile-pic').src = currentUser.picProfile;
        }
    }

    async function loadRooms() {
        const container = document.getElementById('rooms-container');
        const res = await apiFetch('/room/me');
        if (!res) return;
        if (!res.ok) { container.innerHTML = '<div class="empty-state"><p>Erro ao carregar salas.</p></div>'; return; }
        const rooms = await res.json();
        if (rooms.length === 0) {
            container.innerHTML = '<div class="empty-state"><p>Voce ainda nao esta em nenhuma sala.<br>Crie ou entre em uma sala para comecar.</p></div>';
            return;
        }
        container.innerHTML = '<div class="rooms-grid">' + rooms.map(r => roomCard(r)).join('') + '</div>';
    }

    function roomCard(room) {
        return `
            <div class="room-card">
                <div class="room-card-header">
                    <span class="room-card-name">${escHtml(room.name)}</span>
                </div>
                <span class="room-card-id">ID: ${room.roomId}</span>
                <div class="room-card-actions">
                    <button class="btn-primary btn-sm" onclick="openRoom(${room.roomId}, '${escHtml(room.name)}')">Abrir</button>
                    <button class="btn-ghost btn-sm" onclick="leaveRoom(${room.roomId})">Sair</button>
                </div>
            </div>`;
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function openRoom(roomId, roomName) {
        window.location.href = '/room.html?id=' + roomId + '&name=' + encodeURIComponent(roomName);
    }

    async function leaveRoom(roomId) {
        if (!confirm('Sair desta sala?')) return;
        const res = await apiFetch('/membership/exit/' + roomId, { method: 'DELETE' });
        if (!res) return;
        if (res.ok) {
            showToast('Voce saiu da sala.');
            loadRooms();
        } else {
            const data = await res.text();
            showToast(data || 'Erro ao sair da sala.', true);
        }
    }

    async function createRoom() {
        const name = document.getElementById('room-name').value.trim();
        const invite = document.getElementById('room-invite').value.trim();
        if (!name || !invite) { showToast('Preencha todos os campos.', true); return; }
        const res = await apiFetch('/room/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, invite })
        });
        if (!res) return;
        if (res.ok) {
            closeModal('create-modal');
            document.getElementById('room-name').value = '';
            document.getElementById('room-invite').value = '';
            showToast('Sala criada com sucesso.');
            loadRooms();
        } else {
            const data = await res.text();
            showToast(data || 'Erro ao criar sala.', true);
        }
    }

    async function joinRoom() {
        const invite = document.getElementById('join-invite').value.trim();
        if (!invite) { showToast('Informe o codigo de convite.', true); return; }
        const res = await apiFetch('/room/enter', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ inviteCode: invite })
        });
        if (!res) return;
        if (res.ok) {
            closeModal('join-modal');
            document.getElementById('join-invite').value = '';
            showToast('Voce entrou na sala.');
            loadRooms();
        } else {
            const data = await res.text();
            showToast(data || 'Codigo invalido ou sala nao encontrada.', true);
        }
    }

    async function updateProfile() {
        const nickname = document.getElementById('edit-nickname').value.trim();
        const picProfile = document.getElementById('edit-pic').value.trim();
        if (!nickname) { showToast('O apelido nao pode ser vazio.', true); return; }
        const res = await apiFetch('/user/me', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname, picProfile })
        });
        if (!res) return;
        if (res.ok) {
            closeModal('profile-modal');
            showToast('Perfil atualizado.');
            loadUser();
        } else {
            const data = await res.text();
            showToast(data || 'Erro ao atualizar perfil.', true);
        }
    }

    async function logout() {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/';
    }

    loadUser();
    loadRooms();
</script>
</body>
</html>
